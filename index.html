<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header - AutoDrive</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid grid-rows-[auto_1fr_auto] min-h-screen bg-gray-950 text-white">

<header class="bg-gradient-to-r from-black via-gray-900 to-black border-b border-red-600 shadow-xl">
    <div class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-extrabold text-red-600 tracking-wider">
                AutoDrive Performance
            </h1>
            <p class="text-gray-400 text-sm">
                Ultimate Automotive Experience
            </p>
        </div>

        <div class="hidden md:flex gap-6 text-sm text-gray-300">
            <span class="hover:text-red-500 transition">Since 2020</span>
            <span class="hover:text-red-500 transition">Racing Community</span>
        </div>
    </div>
</header>

<div class="grid grid-cols-5 flex-grow">
    <nav class="col-span-1"></nav>
    <main class="col-span-3"></main>
    <aside class="col-span-1"></aside>
</div>

<footer></footer>

</body>
</html>
